<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | NeuroTrackDL</title>
    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }
        .box {
            background: white;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
        }
        button {
            background: #2a5298;
            color: white;
            border: none;
            cursor: pointer;
        }
        a { color: #2a5298; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>🧠 Register</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
    </form>
    <p><a href="/">Back to Login</a></p>
</div>

</body>
</html>
