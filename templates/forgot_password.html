<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
        }
        .box {
            background: white;
            padding: 30px;
            width: 360px;
            border-radius: 10px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }
        button {
            background: #2a5298;
            color: white;
            border: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🔑 Forgot Password</h2>
    <form method="POST">
        <input type="email" name="email" placeholder="Registered Email" required>
        <button type="submit">Reset Password</button>
    </form>
    <p><a href="/">Back to Login</a></p>
</div>

</body>
</html>
